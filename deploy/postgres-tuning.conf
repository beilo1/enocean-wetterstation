# Sparsame PostgreSQL-Einstellungen für den Raspberry Pi 3B+ (1 GB RAM).
# Inhalt in postgresql.conf einfügen bzw. als conf.d-Datei ablegen.
shared_buffers = 128MB
effective_cache_size = 384MB
work_mem = 16MB
maintenance_work_mem = 48MB
max_connections = 20
wal_compression = on
synchronous_commit = off          # bei einem Stromausfall ggf. letzte Sekunden verlieren – für Wetterdaten ok
checkpoint_completion_target = 0.9
